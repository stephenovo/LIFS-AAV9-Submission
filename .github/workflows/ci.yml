name: CI

on:
  push:
    branches: [main, updated-7.0]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest
      - name: Verify frozen submission integrity
        run: PYTHONPATH=src python scripts/verify_submission.py
